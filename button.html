</head>
<body>
    <div id="parent">
        <div><button id="btn1">Button 1</button></div>

                alert (event.target.innerHTML = "was clicked");

        let button = document.createElement("button");

        let para = document.createElement("p");
        para.innerText = "......Insert here.......";

        document.body.appendChild(para);

            document.getElementById("para").innerHTML="ABESEC"
        })
